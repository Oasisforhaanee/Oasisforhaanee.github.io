<link rel="stylesheet" href="{{ '/assets/css/ask-oasis.css' | relative_url }}">
<button id="ask-toggle" type="button" aria-expanded="false" aria-controls="ask-panel">Ask Oasis</button>
<section id="ask-panel" aria-labelledby="ask-title" hidden>
  <header><strong id="ask-title">Ask Oasis</strong><button id="ask-close" type="button" aria-label="Close search">×</button></header>
  <p class="ask-note">Find articles in this blog. Search works without AI.</p>
  <div id="ask-results" role="log" aria-live="polite" aria-relevant="additions"></div>
  <form id="ask-form"><label for="ask-question">Keyword or question</label><input id="ask-question" maxlength="500" required autocomplete="off" placeholder="Try: Fourier transform"><label class="ask-consent"><input id="ask-ai" type="checkbox" disabled> Use AI (sends your question and matching excerpts to Google)</label><button id="ask-submit" type="submit">Find posts</button></form>
  <p id="ask-status" role="status">AI is not connected. Blog search is available.</p>
</section>
<script src="{{ '/assets/js/ask-oasis.js' | relative_url }}" defer></script>
