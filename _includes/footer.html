<script src="/assets/js/main.js" defer="defer"></script>
{%- if site.google_analytics -%}
  <!-- Google tag (gtag.js) -->
  <script
  async
  src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"
  ></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag("js", new Date());

    gtag("config", "{{ site.google_analytics }}");
  </script>
{%- endif -%}
{%- if page.url == '/archive/' -%}
  <script src="/assets/js/search.min.js"></script>
  <script>
    var sjs = SimpleJekyllSearch({
      searchInput: document.getElementById('search-input'),
      resultsContainer: document.getElementById('search-results'),
      json: '/assets/search.json',
    });
  </script>
{%- endif -%}
<!-- GoatCounter visitor tracking -->
<script data-goatcounter="https://oasisforhaanee.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<!-- Visitor counter display (reads /assets/stats.json updated by GitHub Actions) -->
<script>
  (function () {
    var todayEl = document.getElementById('visitor-today');
    var totalEl = document.getElementById('visitor-total');
    if (!todayEl || !totalEl) return;
    fetch('/assets/stats.json?ts=' + Date.now(), {cache: 'no-store'})
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (typeof d.today === 'number') todayEl.textContent = d.today;
        if (typeof d.total === 'number') totalEl.textContent = d.total;
      })
      .catch(function () {});
  })();
</script>
