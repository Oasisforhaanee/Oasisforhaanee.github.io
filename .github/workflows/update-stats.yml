name: Update visitor stats

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch GoatCounter stats
        env:
          API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, datetime, urllib.request

          key = os.environ.get("API_KEY", "")
          if not key:
              print("ERROR: GOATCOUNTER_API_KEY secret is not set")
              raise SystemExit(1)

          req = urllib.request.Request(
              "https://oasisforhaanee.goatcounter.com/api/v0/stats/total",
              headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
          except Exception as e:
              print("ERROR: GoatCounter API call failed:", e)
              raise SystemExit(1)   # do NOT overwrite stats.json with zeros

          if not isinstance(data, dict) or "total" not in data:
              print("ERROR: unexpected API response:", str(data)[:200])
              raise SystemExit(1)

          # This GoatCounter account's timezone is Asia/Seoul, so the daily
          # stats keys are KST dates and "daily" is the KST-day pageview count.
          # "today" = the daily value for the current KST date.
          KST = datetime.timezone(datetime.timedelta(hours=9))
          kst_today = datetime.datetime.now(KST).date().isoformat()
          by_day = {s.get("day"): s for s in data.get("stats", [])}
          today = by_day.get(kst_today, {}).get("daily", 0)

          out = {
              "today": today,
              "total": data.get("total", 0),
              "updated": datetime.datetime.now(datetime.timezone.utc).isoformat() + "Z",
          }
          with open("assets/stats.json", "w") as f:
              json.dump(out, f)
          print("stats:", out)
          EOF

      - name: Commit and push if changed
        run: |
          if git diff --quiet assets/stats.json; then
            echo "No changes to stats.json"
          else
            git config user.name "Haanee's Oasis"
            git config user.email "kkul20235@users.noreply.github.com"
            git add assets/stats.json
            git commit -m "Update visitor stats [skip ci]"
            git push
            echo "Pushed updated stats"
          fi
